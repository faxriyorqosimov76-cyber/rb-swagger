# =================================================================
# 4. COMPONENTS (Ma'lumot modellari)
# =================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    OrderPayload:
      type: object
      required:
        - tin
        - application_id
        - products
      properties:
        tin:
          type: string
          description: "STIR (TIN) raqami"
          example: "123456789"
        application_id:
          type: integer
          description: "Ariza identifikatori"
          example: 5501
        products:
          type: array
          description: "Sotib olinayotgan mahsulotlar ro'yxati"
          items:
            type: object
            required:
              - amount
              - num
              - product_id
            properties:
              amount:
                type: number
                format: float
                description: "Mahsulot narxi/summasi"
                example: 1500000.00
              num:
                type: integer
                description: "Mahsulot soni"
                example: 2
              product_id:
                type: string
                description: "Mahsulotning ID raqami"
                example: "PROD-9982"

    # Umumiy javob modeli (v2)
    ApiResponse:
      type: object
      properties:
        error:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          example: "28.04.2026 10:37:58"
        status:
          type: integer
          example: 200
        path:
          type: string
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    # Mahsulot kategoriyasi modeli (Daraxt ko'rinishi uchun)
    Category:
      type: object
      properties:
        id:
          type: integer
          description: Kategoriyaning unikal IDsi
          example: 121102
        parent_id:
          type: integer
          nullable: true
          description: Otasining IDsi (eng yuqori sath bo'lsa 0 yoki null)
          example: 1211
        name:
          type: string
          description: Kategoriyaning nomi
          example: "Chorva mollari"
        has_children:
          type: boolean
          description: Ichida yana sub-kategoriyalar bor yoki yo'qligi
          example: true
        products_count:
          type: integer
          description: Kategoriya va uning barcha quyi tizimidagi jami faol mahsulotlar soni
          example: 125
        level:
          type: integer
          description: Kategoriya sathi (v2 uchun)
          example: 1
        children:
          type: array
          description: Quyi sathi kategoriyalari (v2 uchun rekursiv)
          items:
            $ref: '#/components/schemas/Category'

    # Ochiq kategoriya modeli (Public API uchun)
    PublicCategory:
      type: object
      properties:
        id:
          type: integer
          description: Kategoriya IDsi
          example: 12
        name:
          type: string
          description: Tanlangan tildagi kategoriya nomi
          example: "Elektronika"
        num:
          type: integer
          description: Tartib raqami (Sorting order)
          example: 1
        icon:
          type: string
          nullable: true
          description: Kategoriya uchun rasm yoki belgi (URL yoki klass nomi)
          example: "fa-mobile-alt"

    # Mahsulot modeli (Products API uchun)
    Product:
      type: object
      properties:
        product_id:
          type: integer
          description: Mahsulotning IDsi
          example: 1001
        name:
          type: string
          description: Tanlangan tildagi mahsulot nomi
          example: "iPhone 15 Pro"
        image_id:
          type: string
          description: Asosiy rasm IDsi (URL uchun)
          example: "photo_2024_01.jpg"
        current_price:
          type: number
          description: Hozirgi sotuv narxi
          example: 12000000
        original_price:
          type: number
          nullable: true
          description: Eski (chegirma bo'lishidan oldingi) narxi
          example: 14000000
        is_discounted:
          type: boolean
          description: Chegirma bormi yoki yo'q
          example: true
        discount_percentage:
          type: integer
          description: Chegirma foizi
          example: 14
        average_rating:
          type: integer
          description: O'rtacha reyting
          example: 5
        reviews_count:
          type: integer
          description: Izohlar soni
          example: 24
        available_amount:
          type: integer
          description: Omborxonadagi mavjud qoldiq
          example: 50

    # Kategoriya bo'yicha mahsulot modeli
    CategoryProduct:
      type: object
      properties:
        product_id:
          type: integer
          example: 201
        title:
          type: string
          description: "Mahsulot nomi (tilga moslangan)"
          example: "`Televizor LG Ultra HD"
        image_id:
          type: string
          example: "img-889-xyz"
        current_price:
          type: number
          format: double
          example: 5400000
        original_price:
          type: number
          format: double
          example: 6000000
        is_discounted:
          type: boolean
          example: true
