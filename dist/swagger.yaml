openapi: 3.0.0
info:
  title: Smart-marker API documentation
  description: >
    Bu hujjatda smart-marker uchun yozilgan api 
    dasturlar haqida malumot berilgan. Shu hujjatdan foydalanib siz smart-marker uchun 
    mobil ilova yaratishingiz mumkin. 
    Dasturni ishlab chiqishda qandaydir xatolikka duch kelsangiz yoki savolingiz bo'lsa
    bizga murojaat qilishingiz mumkin.
  version: 1.0.0

# =================================================================
# 1. TAGS (Guruhlar)
# =================================================================
tags:
  - name: Categories
    description: Mahsulot kategoriyalari bilan ishlash bo'limi (Asosiy va Ochiq kategoriyalar)
  - name: Products
    description: Mahsulotlar bilan ishlash bo'limi
  - name: User
    description: Foydalanuvchi profili va sozlamalari
  - name: Content
    description: Reklama va axborot kontentlari (Bannerlar va h.k.)
  - name: Orders
    description: Xaridor buyurtmalari bilan ishlash bo'limi
  - name: Bank Credit
    description: Bank krediti orqali buyurtma berish endpointlari
  - name: Family Credit
    description: Oilaviy kredit orqali buyurtma berish endpointlari
  - name: Mahalla Sudo
    description: Online Mahalla Sudo orqali buyurtma berish endpointlari
  - name: Card
    description: Foydalanuvchi bank kartalarini boshqarish bo'limi
  - name: Sessions
    description: Foydalanuvchi qurilmalari va faol seanslarini boshqarish bo'limi
  - name: Regions
    description: Regionlar va tumanlar ma'lumotnomasi
  - name: Tenders
    description: Tender mahsulotlari va tender ma'lumotlari bilan ishlash bo'limi

# =================================================================
# 2. SERVERS (Server manzillari)
# =================================================================
servers:
  - url: https://api.cabinet.smart-market.uz/api/
    description: Asosiy ishchi server

# =================================================================
# 3. PATHS (API Endpointlari)
# =================================================================
paths:

  # -----------------------------------------------------------------
  # CATEGORIES: Ierarxik daraxt ko'rinishidagi kategoriyalar
  # -----------------------------------------------------------------
  /v1/mobile/product/categories-tree:
    get:
      tags:
        - Categories
      summary: Kategoriyalar ro'yxatini olish (Lazy Loading)
      description: |
        `parent_id` yuborilsa, o'sha kategoriyaning ichidagi child-kategoriyalarni qaytaradi. 
        Agar yuborilmasa yoki 0 yuborilsa, eng yuqori (Root) sathni qaytaradi.
      parameters:
        - name: parent_id
          in: query
          description: Yuqori sath kategoriyasining ID raqami.
          required: false
          schema:
            type: integer
            default: 0
            example: 101
      responses:
        '200':
          description: Muvaffaqiyatli natija
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '400':
          description: Noto'g'ri so'rov parametrlari
        '500':
          description: Serverdagi ichki xatolik

  # -----------------------------------------------------------------
  # CATEGORIES: Ierarxik daraxt ko'rinishidagi kategoriyalar (v2)
  # -----------------------------------------------------------------
  /v2/mobile/product/categories-tree:
    get:
      tags:
        - Categories
      summary: Mahsulot kategoriyalari daraxtini olish (v2)
      responses:
        '200':
          description: Muvaffaqiyatli javob
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # -----------------------------------------------------------------
  # CATEGORIES: Ochiq (Public) kategoriyalar ro'yxati
  # -----------------------------------------------------------------
  /v1/public/product/categories:
    get:
      tags:
        - Categories
      summary: Asosiy (Root) kategoriyalar ro'yxatini olish (Public)
      description: |
        Faqat `state = 1` va `parent_id = 0` bo'lgan, ya'ni eng yuqori sathdagi kategoriyalarni qaytaradi. 
        So'rovda yuborilgan `#lan` (language) parametriga qarab kategoriya nomi mos tilda qaytadi.
      parameters:
        - name: lan
          in: header
          description: "Tilni tanlash: 'la' (Latin), 'ru' (Russian), 'uz' (Cyrillic - default)"
          required: false
          schema:
            type: string
            enum: [la, ru, uz]
            default: uz
      responses:
        '200':
          description: Kategoriyalar muvaffaqiyatli yuklandi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicCategory'
        '500':
          description: Server xatoligi

  # -----------------------------------------------------------------
  # PRODUCTS: Yangi mahsulotlar ro'yxati (SQL so'rovi asosida)
  # -----------------------------------------------------------------
  /v1/mobile/products/new:
    get:
      tags:
        - Products
      summary: Mahsulotlar ro'yxatini olish
      description: |
        Barcha faol mahsulotlarni sahifalangan holda qaytaradi. 
        Yuborilgan `#lan` (language) parametriga qarab mahsulot nomi mos tilda qaytadi.
      parameters:
        - name: lan
          in: header
          description: "Tilni tanlash: 'la' (Latin), 'ru' (Russian), 'uz' (Cyrillic - default)"
          required: false
          schema:
            type: string
            enum: [la, ru, uz]
            default: uz
        - name: page
          in: query
          description: Sahifa raqami
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Bir sahifadagi mahsulotlar soni
          required: false
          schema:
            type: integer
            default: 8
      responses:
        '200':
          description: Mahsulotlar muvaffaqiyatli yuklandi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          description: Server xatoligi

  # -----------------------------------------------------------------
  # PRODUCTS: Kategoriya bo'yicha mahsulotlar ro'yxati
  # -----------------------------------------------------------------
  /v1/mobile/category/products:
    get:
      tags:
        - Products
      summary: Kategoriya bo'yicha mahsulotlar ro'yxati
      description: |
        Muayyan kategoriya IDsi asosida saralangan va filtrlanadi mahsulotlar ro'yxatini qaytaradi.
      parameters:
        - name: category_id
          in: query
          description: "Kategoriya identifikatori (Masalan: elektronika, maishiy texnika va h.k.)"
          required: true
          schema:
            type: integer
            format: int64
        - name: Accept-Language
          in: header
          description: "Tilni tanlash (uz, ru, la)"
          required: false
          schema:
            type: string
            enum: [uz, ru, la]
            default: uz
        - name: page
          in: query
          description: Sahifa raqami
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Har bir sahifadagi elementlar soni
          required: false
          schema:
            type: integer
            default: 8
      responses:
        '200':
          description: Kategoriyaga tegishli mahsulotlar muvaffaqiyatli qaytarildi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryProduct'
        '400':
          description: Noto'g'ri so'rov parametrlari yuborildi

  # -----------------------------------------------------------------
  # PRODUCTS: O'xshash mahsulotlar ro'yxati
  # -----------------------------------------------------------------
  /v1/mobile/products/similar:
    get:
      tags:
        - Products
      summary: O'xshash mahsulotlar ro'yxati
      description: |
        Berilgan mahsulot IDsi asosida unga mos keluvchi (bir xil kategoriyadagi va narxi yaqin) boshqa mahsulotlarni qaytaradi.
      parameters:
        - name: product_id
          in: query
          description: "Asosiy mahsulot identifikatori"
          required: true
          schema:
            type: integer
            format: int64
        - name: Accept-Language
          in: header
          description: "Til: uz, ru, la"
          required: false
          schema:
            type: string
            enum: [uz, ru, la]
            default: uz
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: O'xshash mahsulotlar muvaffaqiyatli topildi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimilarProduct'
        '404':
          description: Asosiy mahsulot topilmadi

  # -----------------------------------------------------------------
  # PRODUCTS: Tavsiya etilgan mahsulotlar ro'yxati
  # -----------------------------------------------------------------
  /v1/mobile/products/recommended:
    get:
      tags:
        - Products
      summary: Tavsiya etilgan mahsulotlar ro'yxati
      description: |
        Tizimdagi 'TOP' servis turiga ega bo'lgan mahsulotlarni qaytaradi. 
        Response tarkibida jami mahsulotlar soni (all_count) va mahsulotlar ro'yxati (recommended_products) mavjud.
      parameters:
        - name: Accept-Language
          in: header
          description: "Tilni tanlash: uz, ru, la"
          required: false
          schema:
            type: string
            enum: [uz, ru, la]
            default: uz
        - name: page
          in: query
          description: Sahifa raqami
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Sahifadagi mahsulotlar soni
          required: false
          schema:
            type: integer
            default: 8
      responses:
        '200':
          description: Muvaffaqiyatli yakunlandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  all_count:
                    type: integer
                    description: "Filtrga mos keluvchi barcha mahsulotlarning umumiy soni"
                    example: 120
                  recommended_products:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecommendedProduct'

  # -----------------------------------------------------------------
  # PRODUCTS: Mahsulot haqida to'liq ma'lumot (v2)
  # -----------------------------------------------------------------
  /v2/mobile/product/details:
    get:
      tags:
        - Products
      summary: Mahsulot haqida to'liq ma'lumot (v2)
      description: |
        Mahsulotning texnik parametrlari, sotuvchi ma'lumotlari, 
        variatsiyalari (rang, xotira) va reytingini o'z ichiga olgan batafsil ma'lumot.
      parameters:
        - name: product_id
          in: query
          required: true
          schema:
            type: integer
          example: 1599627
        - name: lang
          in: query
          required: false
          description: "Til kodi (uz, ru, la)"
          schema:
            type: string
            enum: [uz, ru, la]
            default: uz
        - name: User-Agent
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailsResponse'

  # -----------------------------------------------------------------
  # PRODUCTS: Mahsulotga qoldirilgan izohlar ro'yxati
  # -----------------------------------------------------------------
  /v1/mobile/product/comments:
    get:
      tags:
        - Products
      summary: Mahsulotga qoldirilgan izohlar ro'yxati
      description: Muayyan mahsulot uchun foydalanuvchilar tomonidan qoldirilgan reyting va matnli izohlarni qaytaradi.
      parameters:
        - name: product_id
          in: query
          description: "Mahsulot identifikatori"
          required: true
          schema:
            type: integer
            format: int64
        - name: lang
          in: query
          description: "Til kodi (la - lotin, uz - kirill). Muallif ismini moslashtirish uchun ishlatiladi."
          required: false
          schema:
            type: string
            enum: [uz, ru, la]
            default: uz
      responses:
        '200':
          description: Izohlar ro'yxati muvaffaqiyatli qaytarildi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductComment'
        '400':
          description: Noto'g'ri mahsulot IDsi yuborildi

  # -----------------------------------------------------------------
  # PRODUCTS: Tanlangan IDlar ro'yxati bo'yicha mahsulotlar (Cart/Saved)
  # -----------------------------------------------------------------
  /v1/mobile/products/by-ids:
    post:
      tags:
        - Products
      summary: Tanlangan IDlar ro'yxati bo'yicha mahsulotlar (Cart/Saved)
      description: |
        Ushbu endpoint savatchadagi yoki saqlanganlar ro'yxatidagi mahsulotlar IDlari asosida 
        ulardan to'liq ma'lumotlarni yig'ib beradi. Natijalar yuborilgan tartibda qaytariladi.
      parameters:
        - name: Accept-Language
          in: header
          description: "Til kodi (uz, ru, la)"
          required: false
          schema:
            type: string
            enum: [uz, ru, la]
            default: uz
        - name: lan
          in: header
          description: "Transliteratsiya uchun til parametri"
          required: false
          schema:
            type: string
            example: "la"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - products_list
              properties:
                products_list:
                  type: array
                  description: "Mahsulot IDlari massivi"
                  items:
                    type: integer
                  example: [1619946, 1619945, 1619942, 1619930]
      responses:
        '200':
          description: Muvaffaqiyatli yakunlandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBulkResponse'

  # -----------------------------------------------------------------
  # USER: Foydalanuvchi profili va manzillarini yangilash
  # -----------------------------------------------------------------
  /v2/mobile/user:
    put:
      tags:
        - User
      summary: "Foydalanuvchi profili va manzillarini yangilash"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photo:
                  type: string
                mobile_phone:
                  type: string
                telegram_id:
                  type: string
                email:
                  type: string
                region_id:
                  type: integer
                district_id:
                  type: integer
                message_type:
                  type: string
                  description: "Misol: 'sms,telegram,email', 'telegram', 'email' yoki bo'sh string"
                insert_address:
                  type: array
                  items:
                    type: object
                    properties:
                      region_id:
                        type: integer
                      district_id:
                        type: integer
                      address:
                        type: string
                update_address:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
                        description: "Qaysi manzilni yangilashni bildirish uchun id kerak"
                      state:
                        type: integer
                      region_id:
                        type: integer
                      district_id:
                        type: integer
                      address:
                        type: string
      x-aliases:
        - name: update_users
          handler: sql_update
        - name: add_addresses
          handler: sql_bulk_insert
        - name: update_address
          handler: sql_batch_update
      responses:
        '200':
          description: "Muvaffaqiyatli yangilandi"
        '401':
          description: "Avtorizatsiya xatosi (Token eskirgan yoki noto'g'ri)"

  # -----------------------------------------------------------------
  # USER: Foydalanuvchi ma'lumotlarini olish
  # -----------------------------------------------------------------
  /v2/mobile/user/info:
    get:
      tags:
        - User
      summary: Foydalanuvchi ma'lumotlarini olish
      description: |
        Tizimga kirgan foydalanuvchining profili, bank rekvizitlari, 
        yuridik manzili va shartnoma (oferta) holati haqida ma'lumot qaytaradi.
      security:
        - BearerAuth: []
      parameters:
        - name: Authorization
          in: header
          description: "Bearer token (Masalan: Bearer {token})"
          required: true
          schema:
            type: string
        - name: User-Agent
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Foydalanuvchi ma'lumotlari muvaffaqiyatli olindi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: Avtorizatsiya xatosi (Token eskirgan yoki noto'g'ri)

  # -----------------------------------------------------------------
  # USER: Foydalanuvchi bank kartalari
  # -----------------------------------------------------------------
  /v1/mobile/user/cards:
    get:
      tags:
        - User
      summary: Foydalanuvchi kartalarini olish
      description: "owner_id bo'yicha faol (state > 0) kartalar ro'yxatini qaytaradi."
      security:
        - BearerAuth: []
      parameters:
        - name: Authorization
          in: header
          description: "Bearer token (Masalan: Bearer {token})"
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Kartalar ro'yxati muvaffaqiyatli qaytarildi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '401':
          description: Avtorizatsiya xatosi (Token eskirgan yoki noto'g'ri)

  # -----------------------------------------------------------------
  # USER: Sotuvchining balansi va garov miqdori
  # -----------------------------------------------------------------
  /v1/mobile/user/balance:
    get:
      tags:
        - User
      summary: Foydalanuvchi balansini olish
      description: "Sotuvchining joriy saldo va garov (bail) summalarini qaytaradi."
      security:
        - BearerAuth: []
      parameters:
        - name: Authorization
          in: header
          description: "Bearer token (Masalan: Bearer {token})"
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Balans ma'lumotlari muvaffaqiyatli qaytarildi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Balance'
        '401':
          description: Avtorizatsiya xatosi (Token eskirgan yoki noto'g'ri)

  # -----------------------------------------------------------------
  # USER: Mahsulotlar bo'yicha foydalanuvchi izohlari
  # -----------------------------------------------------------------
  /v1/mobile/user/comments:
    get:
      tags:
        - User
      summary: Mahsulot izohlari ro'yxatini olish
      security:
        - BearerAuth: []
      parameters:
        - name: Authorization
          in: header
          description: "Bearer token (Masalan: Bearer {token})"
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Izohlar muvaffaqiyatli yuklandi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProductComment'
        '401':
          description: Avtorizatsiya xatosi (Token eskirgan yoki noto'g'ri)

  # -----------------------------------------------------------------
  # USER: Foydalanuvchi qidiruv tarixi
  # -----------------------------------------------------------------
  /v1/mobile/user/search-query:
    get:
      tags:
        - User
      summary: Foydalanuvchi qidiruv tarixi ro'yxatini olish
      description: |
        Ushbu endpoint avtorizatsiyadan o'tgan foydalanuvchining oxirgi qidirgan so'rovlarini 
        `created_at` bo'yicha kamayish tartibida qaytaradi.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Ma'lumotlar muvaffaqiyatli qaytarildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchHistoryResponse'
        '401':
          description: Token xato yoki muddati o'tgan (Unauthorized)
    post:
      tags:
        - User
      summary: Yangi qidiruv so'rovini saqlash
      description: |
        Foydalanuvchi qidiruv amalga oshirganda ushbu endpointga so'rov yuboriladi. 
        Agar so'rov avval mavjud bo'lsa, uning vaqti yangilanadi (upsert).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query_text
              properties:
                query_text:
                  type: string
                  description: Qidirilayotgan mahsulot yoki xizmat nomi
                  example: "Iphone 16 Pro Max"
      responses:
        '200':
          description: Muvaffaqiyatli saqlandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCreateResponse'
        '400':
          description: Noto'g'ri so'rov formati
        '401':
          description: Avtorizatsiya xatosi

  # -----------------------------------------------------------------
  # USER: Hududlar va tumanlar ro'yxatini olish
  # -----------------------------------------------------------------
  /v2/mobile/regions:
    get:
      tags:
        - Regions
      summary: Hududlar va ularga tegishli tumanlar ro'yxatini olish
      description: Tizimdagi barcha regionlar va har bir regionga tegishli tumanlar ro'yxatini qaytaradi.
      responses:
        '200':
          description: Hududlar ro'yxati muvaffaqiyatli qaytarildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionsResponse'
              example:
                error: null
                message: null
                timestamp: "04.05.2026 155816"
                status: 200
                path: null
                data:
                  - id: 3
                    name: "Андижон"
                    districts:
                      - id: 301
                        name: "Андижон ш."
                        region_id: 3
                      - id: 303
                        name: "Хонобод ш."
                        region_id: 3
                      - id: 305
                        name: "Қорасув ш."
                        region_id: 3
                      - id: 306
                        name: "Олтинкўл т."
                        region_id: 3
                      - id: 307
                        name: "Андижон т."
                        region_id: 3
                      - id: 308
                        name: "Балиқчи т."
                        region_id: 3

  # -----------------------------------------------------------------
  # CONTENT: Mobil ilova uchun bannerlar ro'yxati
  # -----------------------------------------------------------------
  /v1/mobile/banners:
    get:
      tags:
        - Content
      summary: Mobil ilova uchun bannerlar ro'yxatini olish
      description: |
        Asosiy sahifada ko'rsatiladigan reklama bannerlari ro'yxatini, ularning desktop va mobil versiyalari hamda o'tish havolalari (callback_url) bilan qaytaradi.
      responses:
        '200':
          description: Bannerlar muvaffaqiyatli olindi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerResponse'

  # -----------------------------------------------------------------
  # ORDERS: Xaridor buyurtmalarini olish
  # -----------------------------------------------------------------
  /v1/mobile/buyer/orders:
    get:
      tags:
        - Orders
      summary: Buyurtmalar ro'yxatini olish
      security:
        - BearerAuth: []
      parameters:
        - name: Authorization
          in: header
          description: "Bearer token (Masalan: Bearer {token})"
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ['CREATED', 'ACCEPTED', 'CANCELED', 'REJECTED', 'SYS_CANCELED', 'FISCAL_CREATED', 'UNSIGNED_CONTRACT', 'NOT_DELIVERED']
            example: "ACCEPTED"
        - name: payment_type
          in: query
          required: false
          schema:
            type: string
            enum: ['FAMILY_CREDIT', 'TRANSFER_MONEY', 'RELIABLE_PAYMENT', 'INSTALLMENT_PAYMENT', 'CASH', 'InTend', 'BRB', 'SUDO_MAHALLA', 'TDA', 'BANK_CREDIT']
            example: "SUDO_MAHALLA"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Muvaffaqiyatli javob
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

  # -----------------------------------------------------------------
  # CARD: Foydalanuvchi bank kartalarini boshqarish
  # -----------------------------------------------------------------
  /v1/mobile/card:
    post:
      summary: Yangi karta qo'shish
      description: Foydalanuvchining bank kartasini tizimga bog'lash uchun so'rov.
      tags:
        - Card
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - card_number
                - card_life_time
                - mobile_phone
              properties:
                card_number:
                  type: string
                  description: Karta raqami (16 ta raqam)
                  example: "8600123456789012"
                card_life_time:
                  type: string
                  description: Kartaning amal qilish muddati (MM/YY)
                  example: "12/28"
                mobile_phone:
                  type: string
                  description: Kartaga bog'langan telefon raqami
                  example: "998901234567"
                card_name:
                  type: string
                  description: Kartaga berilgan nom (Masalan, "Asosiy karta")
                  example: "My Visa"
                active_card_type:
                  type: string
                  description: "Karta turi (1: Uzcard/Humo, 2: Visa/Mastercard)"
                  enum: ["1", "2"]
                  example: "1"
                active_card_image:
                  type: string
                  description: Karta dizayni uchun rasm URL manzili
                  example: "https://cdn.smart-market.uz/cards/uzcard_gold.png"
      responses:
        '200':
          description: Karta muvaffaqiyatli qo'shildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardActionResponse'
        '400':
          description: Ma'lumotlar noto'g'ri yuborilgan
        '401':
          description: Avtorizatsiya xatosi
    delete:
      summary: Kartani butunlay o'chirish
      description: |
        Berilgan ID bo'yicha kartani ma'lumotlar bazasidan butunlay o'chirib tashlaydi.
      tags:
        - Card
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: O'chiriladigan karta ID-si
                  example: 45
      responses:
        '200':
          description: Karta bazadan muvaffaqiyatli o'chirildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDeleteResponse'
        '401':
          description: Avtorizatsiya xatosi
        '404':
          description: Karta topilmadi (ID noto'g'ri)

  # -----------------------------------------------------------------
  # SESSIONS: Faol qurilmalar (seanslar) ro'yxati
  # -----------------------------------------------------------------
  /v1/mobile/user/active-devices:
    get:
      summary: Faol qurilmalar (seanslar) ro'yxatini olish
      description: Foydalanuvchining hozirgi vaqtda tizimga kirib turgan barcha qurilmalari ro'yxatini qaytaradi.
      tags:
        - Sessions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Faol seanslar muvaffaqiyatli qaytarildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveDevicesResponse'
        '401':
          description: Avtorizatsiya xatosi (Token xato yoki muddati o'tgan)

  /v1/mobile/user/active-devices/{id}:
    delete:
      summary: Tanlangan seansni yakunlash
      description: |
        Berilgan ID bo'yicha qurilma seansini faolsizlantiradi. 
        Bu foydalanuvchini o'sha qurilmada tizimdan chiqarib yuboradi.
      tags:
        - Sessions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Yakunlanishi kerak bo'lgan seans (token) ID-si
          schema:
            type: integer
            format: int64
            example: 1254
      responses:
        '200':
          description: Seans muvaffaqiyatli yakunlandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    nullable: true
                  message:
                    type: string
                    example: "Seans yakunlandi"
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1254
        '401':
          description: Avtorizatsiya xatosi
        '404':
          description: Seans topilmadi

  /v1/mobile/user/inactive/other-devices:
    put:
      summary: Boshqa barcha sessiyalarni yakunlash
      description: |
        Ushbu endpoint joriy foydalanuvchining boshqa barcha qurilmalardagi 
        faol sessiyalarini tugatadi (inactive holatga o'tkazadi).
      tags:
        - Sessions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Muvaffaqiyatli bajarildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Barcha boshqa qurilmalar tizimdan chiqarildi."
        '401':
          description: Avtorizatsiya xatosi (Token xato yoki muddati o'tgan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server xatosi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

