            in: query
            description: "Sahifa raqami (1 dan boshlanadi)"
            required: false
            schema:
              type: integer
              example: 1
          - name: page_size
            in: query
            description: "Sahifadagi elementlar soni"
            required: false
            schema:
              type: integer
              example: 10
