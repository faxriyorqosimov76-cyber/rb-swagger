                                        buyerTins:
                                          type: array
                                          nullable: true
                                          items:
                                            type: integer
                                        catalogCodes:
                                          type: array
                                          description: "Mahsulot katalog kodlari ro'yxati"
                                          items:
                                            type: string
                                            example: "00101001001000000"
                                  buyerWithoutVat:
                                    type: array
                                    description: "QQS siz xaridor ro'yxati"
                                    items:
                                      type: object
                                  buyerZeroVat:
                                    type: array
                                    description: "Nol stavkali QQS xaridor ro'yxati"
                                    items:
                                      type: object

