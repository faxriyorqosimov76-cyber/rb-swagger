# =================================================================
# 4. COMPONENTS (Ma'lumot modellari)
# =================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    OrderPayload:
      type: object
      required:
        - tin
        - application_id
        - products
      properties:
        tin:
          type: string
          description: "STIR (TIN) raqami"
          example: "123456789"
        application_id:
          type: integer
          description: "Ariza identifikatori"
          example: 5501
        products:
          type: array
          description: "Sotib olinayotgan mahsulotlar ro'yxati"
          items:
            type: object
            required:
              - amount
              - num
              - product_id
            properties:
              amount:
                type: number
                format: float
                description: "Mahsulot narxi/summasi"
                example: 1500000.00
              num:
                type: integer
                description: "Mahsulot soni"
                example: 2
              product_id:
                type: string
                description: "Mahsulotning ID raqami"
                example: "PROD-9982"

    # Umumiy javob modeli (v2)
    ApiResponse:
      type: object
      properties:
        error:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          example: "28.04.2026 10:37:58"
        status:
          type: integer
          example: 200
        path:
          type: string
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    # Mahsulot kategoriyasi modeli (Daraxt ko'rinishi uchun)
    Category:
      type: object
      properties:
        id:
          type: integer
          description: Kategoriyaning unikal IDsi
          example: 121102
        parent_id:
          type: integer
          nullable: true
          description: Otasining IDsi (eng yuqori sath bo'lsa 0 yoki null)
          example: 1211
        name:
          type: string
          description: Kategoriyaning nomi
          example: "Chorva mollari"
        has_children:
          type: boolean
          description: Ichida yana sub-kategoriyalar bor yoki yo'qligi
          example: true
        products_count:
          type: integer
          description: Kategoriya va uning barcha quyi tizimidagi jami faol mahsulotlar soni
          example: 125
        level:
          type: integer
          description: Kategoriya sathi (v2 uchun)
          example: 1
        children:
          type: array
          description: Quyi sathi kategoriyalari (v2 uchun rekursiv)
          items:
            $ref: '#/components/schemas/Category'

    # Ochiq kategoriya modeli (Public API uchun)
    PublicCategory:
      type: object
      properties:
        id:
          type: integer
          description: Kategoriya IDsi
          example: 12
        name:
          type: string
          description: Tanlangan tildagi kategoriya nomi
          example: "Elektronika"
        num:
          type: integer
          description: Tartib raqami (Sorting order)
          example: 1
        icon:
          type: string
          nullable: true
          description: Kategoriya uchun rasm yoki belgi (URL yoki klass nomi)
          example: "fa-mobile-alt"

    # Mahsulot modeli (Products API uchun)
    Product:
      type: object
      properties:
        product_id:
          type: integer
          description: Mahsulotning IDsi
          example: 1001
        name:
          type: string
          description: Tanlangan tildagi mahsulot nomi
          example: "iPhone 15 Pro"
        image_id:
          type: string
          description: Asosiy rasm IDsi (URL uchun)
          example: "photo_2024_01.jpg"
        current_price:
          type: number
          description: Hozirgi sotuv narxi
          example: 12000000
        original_price:
          type: number
          nullable: true
          description: Eski (chegirma bo'lishidan oldingi) narxi
          example: 14000000
        is_discounted:
          type: boolean
          description: Chegirma bormi yoki yo'q
          example: true
        discount_percentage:
          type: integer
          description: Chegirma foizi
          example: 14
        average_rating:
          type: integer
          description: O'rtacha reyting
          example: 5
        reviews_count:
          type: integer
          description: Izohlar soni
          example: 24
        available_amount:
          type: integer
          description: Omborxonadagi mavjud qoldiq
          example: 50

    # Kategoriya bo'yicha mahsulot modeli
    CategoryProduct:
      type: object
      properties:
        product_id:
          type: integer
          example: 201
        title:
          type: string
          description: "Mahsulot nomi (tilga moslangan)"
          example: "`Televizor LG Ultra HD"
        image_id:
          type: string
          example: "img-889-xyz"
        current_price:
          type: number
          format: double
          example: 5400000
        original_price:
          type: number
          format: double
          example: 6000000
        is_discounted:
          type: boolean
          example: true
        discount_percentage:
          type: integer
          example: 10
        average_rating:
          type: integer
          example: 4
        reviews_count:
          type: integer
          example: 12
        available_amount:
          type: number
          example: 12

    # Foydalanuvchi ma'lumotlari javob modeli
    UserInfoResponse:
      type: object
      properties:
        error:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          example: "27.04.2026 16:01:04"
        status:
          type: integer
          example: 200
        data:
          $ref: '#/components/schemas/UserData'

    UserData:
      type: object
      properties:
        org_id:
          type: integer
          description: "Tashkilot STIRi (INN)"
          example: 308835814
        full_name:
          type: string
          description: "Tashkilotning to'liq nomi"
          example: '"TEX PRO-SILVER" MCHJ'
        pinfl:
          type: string
          description: "JSHSHIR (PINFL)"
          example: "32311751470046"
        bank_name:
          type: string
          example: "DAVR BANK XATB"
        account:
          type: string
          description: "Bank hisob raqami"
          example: "20208000905434717001"
        mfo:
          type: string
          example: "01069"
        obl_name:
          type: string
          description: "Viloyat/Shahar nomi"
          example: "Тошкент шахри"
        area_name:
          type: string
          description: "Tuman nomi"
          example: "Яшнобод тумани"
        address:
          type: string
          example: "58-A HARBIY SHAHARCHA, 15-UY"
        header_name:
          type: string
          description: "Rahbarning F.I.SH."
          example: "MAMADALIYEV BAXTIMUROD"
        mobile_phone:
          type: string
          example: "998935547520"
        fully_signed:
          type: string
          description: "Shartnoma to'liq imzolangan sana"
          example: "13.03.2026"
        offer_link:
          type: string
          format: uri
          description: "Oferta hujjati havolasi"
          example: "https://hujjat.uz/document?id=..."
        doc_status:
          type: string
          enum: [FULL_SIGNED, PENDING, REJECTED]
          example: "FULL_SIGNED"
        definition_type:
          type: string
          description: "Tarif turi"
          example: "STANDART"
        checked:
          type: boolean
          example: true

    # Mahsulot tafsilotlari javob modeli (v2)
    ProductDetailsResponse:
      type: object
      properties:
        error:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          example: "27.04.2026 15:45:17"
        status:
          type: integer
          example: 200
        data:
          $ref: '#/components/schemas/ProductData'

    ProductData:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
        available_amount:
          type: integer
        technical_parameters:
          type: string
          description: "HTML formatidagi texnik tavsif"
        is_discounted:
          type: boolean
        main_photo:
          type: string
        region:
          $ref: '#/components/schemas/Location'
        seller:
          $ref: '#/components/schemas/Seller'
        category:
          $ref: '#/components/schemas/IdNamePair'
        product_attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ProductPhoto'

    Seller:
      type: object
      properties:
        name:
          type: string
        tin:
          type: integer
        phone_number:
          type: string
        rating:
          type: number
        comment_number:
          type: integer

    ProductAttribute:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [color, button, select]
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              value:
                type: string
              is_available:
                type: boolean
              image:
                type: string
                nullable: true

    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    IdNamePair:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    ProductPhoto:
      type: object
      properties:
        image:
          type: string
        is_main:
          type: boolean

    # Mahsulot izohi modeli
    ProductComment:
      type: object
      properties:
        id:
          type: integer
          example: 54321
        rating:
          type: integer
          description: "Foydalanuvchi bergan baho (1 dan 5 gacha)"
          example: 5
        comment:
          type: string
          description: "Izoh matni (SQL dagi 'note' maydoni)"
          example: "Juda sifatli mahsulot ekan, tavsiya qilaman!"
        created_at:
          type: string
          description: "Sana va vaqt (dd.mm.yyyy HH:mm formatida)"
          example: "27.04.2026 14:30"
        author_name:
          type: string
          description: "Izoh qoldirgan foydalanuvchining to'liq ismi yoki username'i"
          example: "Eshmatov Toshmat"
        author_photo:
          type: string
          nullable: true
          description: "Foydalanuvchining profil rasmi IDsi yoki URL manzili"
          example: "user_photo_99.png"

    # Ko'p sonli mahsulotlar javob modeli
    ProductBulkResponse:
      type: object
      properties:
        error:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          example: "27.04.2026 16:44:41"
        status:
          type: integer
          example: 200
        path:
          type: string
          nullable: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
        response:
          type: string
          nullable: true

    # Mahsulot kartochkasi modeli (Bulk uchun)
    ProductCard:
      type: object
      properties:
        product_id:
          type: integer
          example: 1619945
        title:
          type: string
          example: "гўшт қиймалагич"
        image_id:
          type: string
          example: "ff80818117fff38c615fb617"
        current_price:
          type: number
          example: 3800000
        original_price:
          type: number
          nullable: true
          example: null
        is_discounted:
          type: boolean
          example: false
        discount_percentage:
          type: integer
          example: 0
        average_rating:
          type: integer
          example: 0
        reviews_count:
          type: integer
          example: 0
        available_amount:
          type: integer
          example: 100

    # Bannerlar javob modeli
    BannerResponse:
      type: object
      properties:
        error:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
