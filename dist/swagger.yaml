  /v1/mobile/tender/products:
    get:
      tags:
        - Tenders
      summary: Tender mahsulotlari ro'yxatini olish
      description: Bearer token bilan himoyalangan tender mahsulotlari ro'yxatini sahifalangan holda qaytaradi.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            example: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 15
            example: 15
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum: [uz, ru, la]
            example: la
        - name: mxiks
          in: query
          required: false
          schema:
            type: string
            example: "08452001003000000"
        - name: application_id
          in: query
          required: true
          schema:
            type: integer
            example: 1057952
      responses:
        '200':
          description: Muvaffaqiyatli natija
        '401':
          description: Token xato yoki muddati o'tgan (Unauthorized)

