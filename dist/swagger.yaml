  # ----------------------------------------------------------------- 
  # SELLER: Mahsulot qo'shish
  # -----------------------------------------------------------------
  /v1/mobile/seller/add/service:
    post:
      tags:
        - Seller tenders
      summary: "Mahsulot qo'shish"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category_id
                - unit_id
                - price
                - amount
              properties:
                name_ru:
                  type: string
                  description: "Mahsulot nomi (rus tilida)"
                  example: "Электромотороллер"
                name:
                  type: string
                  description: "Mahsulot nomi"
                  example: "Электромотороллер"
                identification_code:
                  type: string
                  description: "Mahsulot identifikatsiya kodi (MXIK)"
                  example: "08711001001000000"
                category_id:
                  type: integer
                  description: "Kategoriya ID"
                  example: 10
                unit_id:
                  type: integer
                  description: "O'lchov birligi ID"
                  example: 3
                price:
                  type: number
                  description: "Mahsulot narxi"
                  example: 10500000
                amount:
                  type: number
                  description: "Mahsulot miqdori"
                  example: 100
                min_amount:
                  type: number
                  description: "Minimal miqdor"
                  example: 1
                all_sum:
                  type: number
                  description: "Umumiy summa"
                  example: 1050000000
                husbandry_type:
                  type: string
                  nullable: true
                  description: "Xo'jalik turi"
                  example: "fermer"
                photos:
                  type: array
                  description: "Mahsulot rasmlari"
                  items:
                    type: string
                  example: ["photo1.jpg", "photo2.jpg"]
                video_link:
                  type: string
                  nullable: true
                  description: "Video havola"
                  example: "https://youtube.com/watch?v=xxx"
                technical_parameters:
                  type: string
                  nullable: true
                  description: "Texnik parametrlar (o'zbek tilida)"
                  example: "Quvvat: 3kW, Tezlik: 60km/h"
                technical_parameters_ru:
                  type: string
                  nullable: true
                  description: "Texnik parametrlar (rus tilida)"
                  example: "Мощность: 3кВт, Скорость: 60км/ч"
                payment_types:
                  type: array
                  description: "To'lov turlari"
                  items:
                    type: string
                  example: ["cash", "card", "transfer"]
                region_id:
                  type: integer
                  nullable: true
                  description: "Viloyat ID"
                  example: 10
                district_id:
                  type: integer
                  nullable: true
                  description: "Tuman ID"
                  example: 101
                org_id:
                  type: integer
                  nullable: true
                  description: "Tashkilot ID (bo'lmasa token dan olinadi)"
                  example: 5001
                tender_id:
                  type: integer
                  nullable: true
                  description: "Tender ID (source_id)"
                  example: 70171
      responses:
        '200':
          description: "Mahsulot muvaffaqiyatli qo'shildi"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    nullable: true
                  message:
                    type: string
                    example: "Mahsulot muvaffaqiyatli qo'shildi"
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    nullable: true
        '400':
          description: "Noto'g'ri so'rov formati"
        '401':
          description: "Autentifikatsiya xatosi"

