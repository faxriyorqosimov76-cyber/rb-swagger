                            doc_number:
                              type: string
                              description: "Shartnoma raqami"
                              example: "CTR-2026-0001"
                            doc_status:
                              type: string
                              description: "Shartnoma holati"
                              example: "FULL_SIGNED"
                            order_num:
                              type: string
                              description: "Shartnoma bo'yicha buyurtma raqami"
                              example: "ORD-2026-54321"
                            buyer_name:
                              type: string
                              description: "Xaridorning to'liq ismi"
                              example: "Aliyev Jamshid"
                            seller_name:
                              type: string
                              description: "Ta'minotchi tashkilot nomi"
                              example: "TEX PRO-SILVER MCHJ"
                            order_date:
                              type: string
                              description: "Buyurtma sanasi"
                              example: "2026-06-15"
                            doc_date:
                              type: string
                              description: "Shartnoma sanasi"
                              example: "2026-06-20"
