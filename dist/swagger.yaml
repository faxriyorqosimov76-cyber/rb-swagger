          description: Muvaffaqiyatli bajarildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Barcha boshqa qurilmalar tizimdan chiqarildi."
        '401':
          description: Avtorizatsiya xatosi (Token xato yoki muddati o'tgan)
          content:
