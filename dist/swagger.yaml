          schema:
            type: string
        - name: bdate
          in: query
          description: "Boshlanish sanasi (YYYY-MM-DD)"
          required: false
          schema:
            type: string
            example: "2026-01-01"
        - name: edate
          in: query
          description: "Tugash sanasi (YYYY-MM-DD)"
          required: false
          schema:
            type: string
            example: "2026-12-31"
        - name: transaction_type
          in: query
          description: "Tranzaksiya turi (masalan: 0, 1, 2)"
          required: true
          schema:
            type: integer
