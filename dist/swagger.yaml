            required: true
            description: "Factura sanasi (YYYY-MM-DD)"
            schema:
              type: string
              example: 2026-06-20
          - name: factura_date
            in: query
            required: true
            description: "Factura sanasi (YYYY-MM-DD)"
            schema:
              type: string
              example: 2026-06-21
        responses:
          '200':
            description: "Muvaffaqiyatli javob"
