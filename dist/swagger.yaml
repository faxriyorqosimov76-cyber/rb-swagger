            required: true
            schema:
              type: string
          - name: seller_tin
            in: query
            description: "Ta'minotchi tin raqami (token dan olinadi, agar berilmasa token dagi tin ishlatiladi)"
            required: false
            schema:
              type: string
          - name: contract_type
            in: query
            description: "Shartnoma turi (FAMILY_CREDIT, SUDO_MAHALLA, ALL)"
            required: false
            schema:
              type: string
              example: ALL
          - name: bdate 
            in: query
            description: "Boshlanish sanasi (YYYY-MM-DD)"
            required: false
            schema:
              type: string
              example: 2026-01-01
