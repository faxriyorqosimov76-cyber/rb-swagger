  # -----------------------------------------------------------------
  # SELLER: Facturalar bilan ishlash bo'limi (faktura ma'lumotlarini olish)
  # -----------------------------------------------------------------
  /v1/mobile/seller/facturas:
    get:
      tags:
        - Seller facturas
      summary: "Faktura ma'lumotlarini olish"
      security:
        - BearerAuth: []
      parameters:
        - name: Authorization
          in: header
          description: "Bearer token (Masalan: Bearer {token})"
          required: true
          schema:
            type: string
        - name: seller_tin
          in: query
          required: false
          description: "Ta'minotchi STIR raqami (token dan olinadi, agar berilmasa token dagi tin ishlatiladi)"
          schema:
            type: integer
            example: 12345
        - name: doc_type
          in: query
          required: true
          description: "Shartnoma turi (FAMILY_CREDIT, SUDO_MAHALLA, ALL)"
          schema:
            type: string
            example: "FAMILY_CREDIT"
      responses:
        '200':
          description: "Muvaffaqiyatli javob"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    nullable: true
                  message:
                    type: string
                    nullable: true
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: "Faktura identifikatori"
                        example: 67890
                      contract_id:
                        type: integer
                        description: "Shartnoma identifikatori"
                        example: 12345
                      doc_date:
                        type: string
                        description: "Faktura sanasi"
                        example: "2026-06-20"
                      asum:
                        type: number
                        description: "Faktura summasi"
                        example: 15000000.00
                      buyer_name:
                        type: string
                        description: "Xaridorning to'liq ismi"
                        example: "Aliyev Jamshid"
                      doc_num:
                        type: string
                        description: "Faktura raqami"
                        example: "INV-2026-0001"
                      seller_sign:
                        type: string
                        description: "Ta'minotchi imzolagan yoki yo'qligi"
                        example: "2026-06-22T11:00:00"
                      buyer_sign:
                        type: string
                        description: "Xaridor imzolagan yoki yo'qligi"
                        example: "2026-06-21T10:30:00"
                      doc_date_time:
                        type: string
                        description: "Faktura yaratilgan vaqt"
                        example: "2026-06-20T09:00:00"
                      link:
                        type: string
                        description: "Faktura hujjatiga havola"
                        example: "https://example.com/facturas/67890.pdf"
                      doc_status_text:
                        type: string
                        description: "Faktura holati matni"
                        example: "Бекор қилинди"
                      doc_status:
                        type: string
                        description: "Faktura holati"
                        example: "CANCELED"
                      is_corrector:
                        type: boolean
                        description: "Faktura to'g'rilovchi faktura ekanligi"
                        example: false
        '400':
          description: "Noto'g'ri so'rov"
        '401':
          description: "Avtorizatsiya xatosi"
        '500':
          description: "Server xatosi"
    delete:
      tags:
        - Seller facturas
      summary: "Fakturani o'chirish"
      security:
        - BearerAuth: []
      parameters:
        - name: Authorization
          in: header
          description: "Bearer token (Masalan: Bearer {token})"
          required: true
          schema:
            type: string
        - name: id
          in: query
          required: true
          description: "Faktura identifikatori"
          schema:
            type: integer
            example: 67890
      responses:
        '200':
          description: "Muvaffaqiyatli javob"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    nullable: true
                  message:
                    type: string
                    example: "Faktura muvaffaqiyatli o'chirildi"
                  status:
                    type: integer
                    example: 200
        '400':
          description: "Noto'g'ri so'rov"
        '401':
          description: "Avtorizatsiya xatosi"
        '500':
          description: "Server xatosi"

